# Fixed test tone: 400 Hz at about -12 dBFS.  Change these and rebuild to
# select another fixed frequency/level.
CONFIG_APP_TONE_FREQ_HZ=400
CONFIG_APP_TONE_AMPLITUDE=8000

# Board / console
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Drivers used by the application
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2S=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=4

# UART runs without hardware flow control; its pinctrl state is reduced to
# TX/RX in app.overlay so P0.05 and P0.07 are free for I2S.

# Main thread starts the tone thread and reports both IMUs every 2 seconds.
CONFIG_MAIN_STACK_SIZE=2048
